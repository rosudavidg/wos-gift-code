name: Crawl WoS gift codes

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: gift-code-crawler
  cancel-in-progress: false

jobs:
  crawl:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: Crawl gift codes
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
          GIFT_CODE_API_URL: ${{ vars.GIFT_CODE_API_URL }}
          GIFT_CODE_API_KEY: ${{ secrets.GIFT_CODE_API_KEY }}
        run: python crawler.py
